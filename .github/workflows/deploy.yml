name: deploy

# Manual-only by default. When you're ready to wire this to push-to-main,
# add `push: { branches: [main] }` here AND ensure the WIF prerequisites
# in .github/workflows/README.md are configured in your GCP project.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to (dev/prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

# Required GitHub secrets (set per environment):
#   GCP_PROJECT_ID            e.g. kyrk-projekt-dev
#   GCP_REGION                e.g. europe-north1
#   GCP_WIF_PROVIDER          projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_DEPLOYER_SA           sa-deployer@<project>.iam.gserviceaccount.com
#   PROPELAUTH_URL            https://auth.<tenant>.propelauthtest.com
#   ADMIN_NOTIFY_WEBHOOK      https://<n8n>/webhook/...
#   AGENT_CLIENT_ID           Zitadel machine-user client id for the report agent
#   AGENT_CLIENT_SECRET       Zitadel machine-user client secret (client_credentials)
#
# Built artifacts: pushed to Artifact Registry
#   <region>-docker.pkg.dev/<project>/kyrk/<service>:<sha>
#
# Service URLs are read back from `gcloud run services describe` after each
# deploy and propagated to dependent services (admin-web → intake/cert,
# membership-intake → membership-service).

permissions:
  contents: read
  id-token: write  # required for Workload Identity Federation

env:
  REPO: kyrk
  REGION: ${{ secrets.GCP_REGION }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  TAG: ${{ github.sha }}

jobs:
  # --------------------------------------------------------------- version
  # Resolves the immutable release identity for this deploy. Dispatch the
  # workflow on a release tag (e.g. v0.1.0) and `git describe` returns that
  # tag; every image and running service is then stamped with it, so "what
  # is in prod" reads back to exactly one git ref (GitOps provenance). See
  # docs/31-versionering-och-releaser.md.
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          V=$(git describe --tags --always)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "## Deploy version: \`$V\` → ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ build
  # Builds and pushes images for all services in parallel. Each service is
  # an independent matrix slot — failures don't block the others.
  build-and-push:
    name: build ${{ matrix.service }}
    needs: version
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - membership-service
          - membership-intake
          - certificate-service
          - reporting-service
          - admin-web
          - agent-worker
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ matrix.service }}:${{ env.TAG }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ matrix.service }}:${{ needs.version.outputs.version }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ------------------------------------------------------------ tier-1 deploys
  # Deploy services with no in-cluster dependencies first.
  deploy-membership-service:
    name: deploy membership-service
    needs: [build-and-push, version]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: membership-service
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/membership-service:${{ env.TAG }}
          flags: >-
            --service-account=sa-membership-service@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --no-allow-unauthenticated
            --max-instances=3
            --memory=512Mi
          env_vars: |
            APP_VERSION=${{ needs.version.outputs.version }}
            ADAPTER_MODE=production
            ZITADEL_ISSUER_URL=https://kyrk-auth-oqvxjf.us1.zitadel.cloud
            ZITADEL_CLIENT_ID=376717918169271350
            KMS_KEY_NAME=projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/keyRings/kyrk/cryptoKeys/member-pn

  deploy-certificate-service:
    name: deploy certificate-service
    needs: [build-and-push, version]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: certificate-service
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/certificate-service:${{ env.TAG }}
          flags: >-
            --service-account=sa-certificate-service@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --allow-unauthenticated
            --max-instances=3
            --memory=512Mi
          env_vars: |
            APP_VERSION=${{ needs.version.outputs.version }}
            ADAPTER_MODE=production
            ZITADEL_ISSUER_URL=https://kyrk-auth-oqvxjf.us1.zitadel.cloud
            ZITADEL_CLIENT_ID=376717918169271350


  deploy-reporting-service:
    name: deploy reporting-service
    needs: [build-and-push, version]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: reporting-service
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/reporting-service:${{ env.TAG }}
          flags: >-
            --service-account=sa-reporting-service@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --no-allow-unauthenticated
            --max-instances=3
            --memory=512Mi
          env_vars: |
            APP_VERSION=${{ needs.version.outputs.version }}
            ADAPTER_MODE=production
            ZITADEL_ISSUER_URL=https://kyrk-auth-oqvxjf.us1.zitadel.cloud
            ZITADEL_CLIENT_ID=376717918169271350
            BIGQUERY_PROJECT_ID=${{ env.PROJECT_ID }}
            BIGQUERY_DATASET_ID=kyrk_analytics

  # ------------------------------------------------------------ tier-2 deploys
  # membership-intake depends on membership-service being live so the
  # approval flow can reach it. The MEMBERSHIP_SERVICE_URL is read from the
  # tier-1 deploy output.
  deploy-membership-intake:
    name: deploy membership-intake
    needs: [deploy-membership-service, version]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Resolve membership-service URL
        id: ms
        run: |
          URL=$(gcloud run services describe membership-service \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: membership-intake
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/membership-intake:${{ env.TAG }}
          flags: >-
            --service-account=sa-membership-intake@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --allow-unauthenticated
            --max-instances=5
            --memory=512Mi
          env_vars: |
            APP_VERSION=${{ needs.version.outputs.version }}
            ADAPTER_MODE=production
            ZITADEL_ISSUER_URL=https://kyrk-auth-oqvxjf.us1.zitadel.cloud
            ZITADEL_CLIENT_ID=376717918169271350
            MEMBERSHIP_SERVICE_URL=${{ steps.ms.outputs.url }}
            ADMIN_NOTIFY_WEBHOOK=${{ secrets.ADMIN_NOTIFY_WEBHOOK }}
            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            RECEIPT_FROM_EMAIL=${{ secrets.RECEIPT_FROM_EMAIL }}
            RECEIPT_FROM_NAME=Abune Tekle Haymanot

  # agent-worker consumes the agent-jobs Pub/Sub push and calls the
  # private reporting-service, so it deploys after reporting. Private:
  # only sa-agent-jobs-pusher holds run.invoker (terraform).
  deploy-agent-worker:
    name: deploy agent-worker
    needs:
      - deploy-reporting-service
      - version
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Resolve reporting-service URL
        id: reporting
        run: |
          URL=$(gcloud run services describe reporting-service \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: agent-worker
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/agent-worker:${{ env.TAG }}
          flags: >-
            --service-account=sa-agent-worker@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --no-allow-unauthenticated
            --max-instances=1
            --memory=512Mi
          env_vars: |
            APP_VERSION=${{ needs.version.outputs.version }}
            ADAPTER_MODE=production
            REPORTING_SERVICE_URL=${{ steps.reporting.outputs.url }}
            ZITADEL_ISSUER_URL=https://kyrk-auth-oqvxjf.us1.zitadel.cloud
            AGENT_CLIENT_ID=${{ secrets.AGENT_CLIENT_ID }}
            AGENT_CLIENT_SECRET=${{ secrets.AGENT_CLIENT_SECRET }}

  # admin-web depends on intake + certificate + membership (sunday school,
  # funerals) + reporting (activity logging, KPI).
  deploy-admin-web:
    name: deploy admin-web
    needs:
      - deploy-membership-intake
      - deploy-certificate-service
      - deploy-membership-service
      - deploy-reporting-service
      - version
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Resolve downstream service URLs
        id: urls
        run: |
          INTAKE=$(gcloud run services describe membership-intake \
            --region=${{ env.REGION }} --format='value(status.url)')
          CERT=$(gcloud run services describe certificate-service \
            --region=${{ env.REGION }} --format='value(status.url)')
          MEMBERSHIP=$(gcloud run services describe membership-service \
            --region=${{ env.REGION }} --format='value(status.url)')
          REPORTING=$(gcloud run services describe reporting-service \
            --region=${{ env.REGION }} --format='value(status.url)')
          echo "intake=$INTAKE" >> $GITHUB_OUTPUT
          echo "cert=$CERT" >> $GITHUB_OUTPUT
          echo "membership=$MEMBERSHIP" >> $GITHUB_OUTPUT
          echo "reporting=$REPORTING" >> $GITHUB_OUTPUT

      - name: Resolve admin-web URL
        id: aw
        run: |
          URL=$(gcloud run services describe admin-web --region=${{ env.REGION }} --format='value(status.url)' 2>/dev/null || echo "https://localhost:8080")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: admin-web
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/admin-web:${{ env.TAG }}
          flags: >-
            --service-account=sa-admin-web@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --allow-unauthenticated
            --max-instances=3
            --memory=512Mi
          env_vars: |
            APP_VERSION=${{ needs.version.outputs.version }}
            ADAPTER_MODE=production
            INTAKE_BASE_URL=${{ steps.urls.outputs.intake }}
            CERTIFICATE_BASE_URL=${{ steps.urls.outputs.cert }}
            MEMBERSHIP_BASE_URL=${{ steps.urls.outputs.membership }}
            REPORTING_BASE_URL=${{ steps.urls.outputs.reporting }}
            ADMIN_WEB_COOKIE_SECURE=true
            ZITADEL_ISSUER_URL=https://kyrk-auth-oqvxjf.us1.zitadel.cloud
            ZITADEL_CLIENT_ID=376717918169271350
            ZITADEL_REDIRECT_URI=${{ steps.aw.outputs.url }}/login/callback
            GRANT_DRAFT_MODEL=claude-sonnet-4-20250514
          secrets: |
            ZITADEL_CLIENT_SECRET=zitadel-client-secret:latest
            ANTHROPIC_API_KEY=anthropic-api-key:latest

  # --------------------------------------------------------------- summary
  summary:
    name: deploy summary
    needs:
      - version
      - deploy-membership-service
      - deploy-membership-intake
      - deploy-certificate-service
      - deploy-reporting-service
      - deploy-admin-web
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Print all service URLs
        run: |
          echo "## Deploy summary — version \`${{ needs.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for svc in membership-service membership-intake certificate-service reporting-service admin-web; do
            URL=$(gcloud run services describe $svc --region=${{ env.REGION }} --format='value(status.url)' || echo "n/a")
            echo "| $svc | $URL |" >> $GITHUB_STEP_SUMMARY
          done
