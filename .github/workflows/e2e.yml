name: e2e

# Runs automatically after deploy.yml completes successfully, and can
# also be triggered manually to re-check an already-deployed environment.
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to smoke-test"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ secrets.GCP_REGION }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  # ----------------------------------------------------- gate on success only
  # When triggered by workflow_run, skip the whole thing if the deploy
  # actually failed. workflow_dispatch runs regardless.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      environment: ${{ steps.decide.outputs.environment }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            # workflow_run doesn't expose the originating environment input,
            # so we default to `dev`. Override via manual dispatch for prod.
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  # -------------------------------------------------------------- smoke tests
  # Public, anonymous checks that the golden path responds at all. These
  # are intentionally minimal — the full functional suite runs in ci.yml
  # against in-memory adapters. Here we just confirm the deployed services
  # can accept a request end-to-end.
  smoke:
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.gate.outputs.environment }}
    steps:
      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Public intake POST returns 202
        run: |
          URL=$(gcloud run services describe membership-intake --region=${{ env.REGION }} --format='value(status.url)')
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PNR=$(python3 -c 'import random; l = lambda d: (10 - sum(int(x)*2 - (9 if int(x)*2 > 9 else 0) if i % 2 == 0 else int(x) for i, x in enumerate(d)) % 10) % 10; yy = f"{random.randint(50, 99):02d}"; mm = f"{random.randint(1, 12):02d}"; dd = f"{random.randint(1, 28):02d}"; s3 = f"{random.randint(100, 999):03d}"; chk = l(f"{yy}{mm}{dd}{s3}"); print(f"19{yy}{mm}{dd}-{s3}{chk}")')
          CODE=$(curl -s -o /tmp/intake.json -w "%{http_code}" \
            -X POST "$URL/intake" \
            -H "Content-Type: application/json" \
            -d "{
              \"church_id\": \"e2e-smoke\",
              \"first_name\": \"Smoke\",
              \"last_name\": \"Test\",
              \"phone\": \"+46701234567\",
              \"email\": \"e2e@example.com\",
              \"personal_number\": \"$PNR\",
              \"gdpr_consent\": true,
              \"consent_timestamp\": \"$TS\"
            }")
          if [ "$CODE" != "202" ]; then
            echo "Expected 202 from intake POST, got $CODE"
            cat /tmp/intake.json
            exit 1
          fi
          echo "intake POST ok (202)"

      - name: Public certificate verify returns 404 for unknown id
        run: |
          URL=$(gcloud run services describe certificate-service --region=${{ env.REGION }} --format='value(status.url)')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/certificates/verify/does-not-exist")
          if [ "$CODE" != "404" ]; then
            echo "Expected 404 for unknown certificate, got $CODE"
            exit 1
          fi
          echo "cert verify returns 404 for unknown ok"

      - name: Admin-web login redirects to Zitadel
        run: |
          URL=$(gcloud run services describe admin-web --region=${{ env.REGION }} --format='value(status.url)')
          RESP=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "$URL/login")
          echo "Response: $RESP"
          if echo "$RESP" | grep -E -q "(302|303|307) https://kyrk-auth-oqvxjf\.us1\.zitadel\.cloud"; then
            echo "admin-web login redirects to Zitadel correctly"
          else
            echo "Expected redirect to Zitadel, got: $RESP"
            exit 1
          fi

  # ---------------------------------------------------------------- summary
  summary:
    name: e2e summary
    needs: [gate, smoke]
    if: always() && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report overall result
        run: |
          SMOKE="${{ needs.smoke.result }}"
          echo "## e2e summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- smoke:   $SMOKE" >> $GITHUB_STEP_SUMMARY
          if [ "$SMOKE" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All green." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ One or more checks failed. See the smoke job logs." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
