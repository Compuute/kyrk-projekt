name: Frontend E2E

# Tests run against a build of THIS commit, served locally — never against
# the deployed site. A PR's checks must reflect the PR's own changes, and
# drift on production must not fail unrelated PRs. The local server mimics
# Cloudflare Pages URL semantics but does not run the Pages Functions
# middleware (edge language redirects / KV config are not covered here).

# Runs on PRs (deduped per-ref by concurrency below) and on main, where the
# frontend paths changed — not on every intermediate feature-branch push, which
# previously ran a full browser install per push.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.eleventy.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.eleventy.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-e2e.yml'
  workflow_dispatch:

# Cancel a superseded run on the same ref so rapid pushes collapse to the latest.
concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Mobile + Desktop)
        # playwright.config.js webServer builds the site (npx @11ty/eleventy)
        # and serves frontend/member-portal/dist/ on 127.0.0.1:4173
        working-directory: frontend/member-portal
        run: npx playwright test tests/e2e.spec.js

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: frontend/member-portal/test-results/
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/member-portal/playwright-report/
          retention-days: 7
