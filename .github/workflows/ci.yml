name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same ref so PRs always show the latest result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - membership-service
          - membership-intake
          - certificate-service
          - reporting-service
          - admin-web
          - agent-worker
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Coverage gate lives here (not in pytest.ini) so local single-file
      # TDD runs are not failed by a subset's low coverage.
      - name: Run pytest
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=60

  wifi-portal-tests:
    name: wifi-intake-portal (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/wifi-intake-portal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run content decision tests
        run: node tests/test_content_decision.js

      - name: Run Cloudflare-ready tests
        run: node tests/test_cloudflare_ready.js

  member-portal-tests:
    name: member-portal (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/member-portal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run app tests
        run: node tests/test_app.js

      - name: Run calendar engine tests
        run: node tests/test_calendar_engine.js

      # The Cloudflare-ready test asserts against the eleventy build output
      # (dist/), which is what Cloudflare Pages serves. Build it first, from
      # the repo root where .eleventy.js and package.json live.
      - name: Build site (eleventy)
        working-directory: .
        run: |
          npm ci
          npx @11ty/eleventy

      - name: Run Cloudflare-ready tests
        run: node tests/test_cloudflare_ready.js

  syntax-check:
    name: python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Lightweight gate that catches obvious breakage in any service.
      # We deliberately avoid pinning a linter (ruff/black) at this stage —
      # add one when the team agrees on a style.
      - name: Compile all .py files in the repo
        run: |
          python -m compileall -q services automation/openclaw/import

  terraform-validate:
    name: terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: terraform init -backend=false
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

  commit-hygiene:
    name: commit hygiene (no AI committers)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Authoritative, non-bypassable gate for AI-RULES.md RULE 4: no commit in
      # the PR may be authored/committed by an AI tool or carry AI attribution.
      - name: Check PR commits for AI author/committer/attribution
        run: |
          bash scripts/check-commit-hygiene.sh \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  guard-tests:
    name: repo guard tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Repo-wide guard tests (ops contract, PII filtering, dependency safety,
      # coverage threshold, docs freshness, API contracts). Only stdlib + these.
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Run guard tests
        run: pytest tests/ -q
