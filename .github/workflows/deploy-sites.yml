# GitOps deploy of the public member portal to Cloudflare Pages.
#
# The kyrka-portal Pages project cannot use Cloudflare's built-in git
# integration (it is connected to the wrong repository and Cloudflare does
# not support switching the connected repo on an existing project), so this
# workflow is the production deploy path: merge to main = deploy.
#
# Pull requests get a preview deployment at
# https://<branch>.kyrka-portal.pages.dev instead.
#
# Requires the CLOUDFLARE_API_TOKEN repo secret (custom token with
# "Cloudflare Pages: Edit" on the account).

name: deploy-sites

on:
  push:
    branches: [main]
    paths:
      - "frontend/member-portal/**"
      - "functions/**"
      - ".eleventy.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-sites.yml"
  pull_request:
    paths:
      - "frontend/member-portal/**"
      - "functions/**"
      - ".eleventy.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-sites.yml"
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: 53f6d13a77d3c24c92eb47758a70a296

jobs:
  deploy:
    name: member-portal → Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build app.js (typecheck + esbuild)
        run: make build-js

      - name: Build site (eleventy)
        run: npx @11ty/eleventy

      # wrangler must run from the repo root so the functions/ directory is
      # bundled into the deployment alongside the static dist/.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="main"
          fi
          npx wrangler@4 pages deploy frontend/member-portal/dist \
            --project-name=kyrka-portal --branch="$BRANCH"
