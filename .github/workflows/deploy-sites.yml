# MANUAL FALLBACK deploy of the public member portal to Cloudflare Pages.
#
# The official deploy path is the Pages project's git integration: the
# kyrka-portal project was recreated 2026-06-11 connected to this repo, and
# Cloudflare builds + deploys on every push to main (previews for other
# branches). See ADR-018 and docs/25-deploy-och-innehallsflode.md.
#
# Keep this workflow as a manually triggered escape hatch for when the
# Pages build pipeline itself is unavailable. It deploys the SAME content
# the same way (wrangler direct upload from the repo root, bundling
# functions/).
#
# Requires the CLOUDFLARE_API_TOKEN repo secret (custom token with
# "Cloudflare Pages: Edit" on the account).

name: deploy-sites

on:
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: 53f6d13a77d3c24c92eb47758a70a296

jobs:
  deploy:
    name: member-portal → Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build app.js (typecheck + esbuild)
        run: make build-js

      - name: Build site (eleventy)
        run: npx @11ty/eleventy

      # wrangler must run from the repo root so the functions/ directory is
      # bundled into the deployment alongside the static dist/.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4 pages deploy frontend/member-portal/dist \
            --project-name=kyrka-portal --branch=main
